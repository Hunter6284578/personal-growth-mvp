  <!-- 右耳 -->
  <path d="M22 9.5 C 24.5 7.5, 26 6.5, 25.5 9 C 25 11, 23 11.5, 21.5 11" />
  <!-- 左眼 -->
  <circle cx="13" cy="16" r="0.7" fill="#1e5aa8" stroke="none" />
  <!-- 右眼 -->
  <circle cx="19" cy="16" r="0.7" fill="#1e5aa8" stroke="none" />
  <!-- 鼻梁 -->
  <path d="M16 17 L 16 20" />
  <!-- 左鼻孔 -->
  <path d="M14.5 21.5 C 14 22, 14 22.5, 14.5 22.5" />
  <!-- 右鼻孔 -->
  <path d="M17.5 21.5 C 18 22, 18 22.5, 17.5 22.5" />
  <!-- 嘴 -->
  <path d="M14 24 C 15 24.6, 17 24.6, 18 24" />
</svg>
