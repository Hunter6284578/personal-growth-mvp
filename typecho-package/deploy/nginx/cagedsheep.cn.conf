server {
    listen 80;
    listen [::]:80;
    server_name 【cagedsheep.cn】 【www.cagedsheep.cn】;
    access_log /var/log/nginx/【cagedsheep.cn】.access.log;
    error_log  /var/log/nginx/【cagedsheep.cn】.error.log warn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 【cagedsheep.cn】 【www.cagedsheep.cn】;
    root /var/www/【cagedsheep.cn】/public;
    index index.php index.html;
    access_log /var/log/nginx/【cagedsheep.cn】.access.log;
    error_log  /var/log/nginx/【cagedsheep.cn】.error.log warn;
    ssl_certificate     【/etc/ssl/certs/your_fullchain.pem】;
    ssl_certificate_key 【/etc/ssl/private/your_privkey.key】;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    client_max_body_size 32m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
