server {
    listen 80;
    listen [::]:80;
    server_name cagedsheep.cn www.cagedsheep.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cagedsheep.cn www.cagedsheep.cn;
    root /var/www/cagedsheep.cn/public;
    index index.php index.html;
    access_log /var/log/nginx/cagedsheep.cn.access.log main;
    error_log  /var/log/nginx/cagedsheep.cn.error.log warn;

    ssl_certificate     【/etc/ssl/certs/fullchain.pem】;
    ssl_certificate_key 【/etc/ssl/private/privkey.pem】;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    if ($bad_ua) { return 403; }
    include /etc/nginx/conf.d/bad-ip.conf;
    if ($request_uri ~* "(\.\./|%2e%2e|%00|/etc/passwd|/proc/self/environ)") { return 403; }

    location ~* (^|/)\.(git|svn|hg|env|htaccess|htpasswd) { deny all; }
    location ~* \.(bak|old|orig|save|swp|sql|ini|log|conf)$ { deny all; }
    location ~* /(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|Dockerfile|docker-compose\.yml)$ { deny all; }
    location ~* ^/(usr/uploads|uploads)/.*\.(php|phar)$ { deny all; }

    location = /【后台入口别名】 {
        return 302 /admin/login.php?entry=【后台入口令牌】;
    }

    location / {
        limit_req zone=req_per_ip burst=30 nodelay;
        limit_conn conn_per_ip 30;
        try_files $uri $uri/ /index.php?$args;
    }

    location = /admin/login.php {
        limit_req zone=login_per_ip burst=5 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        include fastcgi_params;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
